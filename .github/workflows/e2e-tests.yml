name: E2E Tests & Report Generation

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

jobs:
  run-e2e-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: |
          cd appium-tests
          npm install

      - name: Run E2E Tests
        run: |
          node appium-tests/test.mjs

      - name: Upload Excel Test Report
        uses: actions/upload-artifact@v4
        with:
          name: Mobile-Appium-Test-Report
          path: "Mobile_Test_Report.xlsx"
